name: Build HRS01 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/workflows/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout HRS01
        uses: actions/checkout@v4

      - name: Verify and prepare web app
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html || {
            echo "::error::Root index.html was not found. Upload the HRS HTML file to the repository root and name it index.html."
            exit 1
          }
          mkdir -p www
          while IFS= read -r -d '' file; do
            case "$file" in
              .git/*|.github/*|android/*|www/*|node_modules/*)
                continue
                ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done < <(git ls-files -z)
          test -s www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize Capacitor
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'EOF'
          {
            "name": "hrs01-mobile",
            "version": "1.0.0",
            "private": true,
            "description": "HRS01 Android application"
          }
          EOF
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sdaghattk.hrs01",
            "appName": "HRS01",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRS01-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
