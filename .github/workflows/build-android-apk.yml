
name: Build HRS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build HRS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout HRS
        uses: actions/checkout@v4

      - name: Prepare web files
        run: |
          mkdir -p www
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .git/*|.github/*|android/*|www/*)
                continue
                ;;
            esac
            mkdir -p "www/$(dirname "$file")"
            cp "$file" "www/$file"
          done
          test -f www/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sdaghattk.hrs",
            "appName": "HRS",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HRS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
