name: Build HRS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout HRS
        uses: actions/checkout@v4

      - name: Verify and prepare web app
        run: |
          test -f index.html || { echo 'Root index.html was not found'; exit 1; }
          mkdir -p www
          cp index.html www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor Android project
        run: |
          cat > package.json <<'PACKAGE'
          {
            "name": "hrs-mobile",
            "version": "1.0.0",
            "private": true,
            "description": "HRS mobile application"
          }
          PACKAGE
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.sdaghattk.hrs",
            "appName": "HRS",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          CONFIG
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
